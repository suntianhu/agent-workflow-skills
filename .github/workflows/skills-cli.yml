name: Skills CLI compatibility
on:
  workflow_dispatch:
    inputs:
      report_public_install:
        description: Report public skill identifiers to skills.sh from this hosted runner
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      npm_config_ignore_scripts: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned official CLI without lifecycle scripts
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/skills-cli-tool" --ignore-scripts --no-audit --no-fund skills@1.7.4
      - name: Install public skills with guarded reporting
        shell: bash
        env:
          AW_REPORT_PUBLIC_INSTALL: ${{ inputs.report_public_install }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN
          export AW_SKILLS_EVENT_LOG="$RUNNER_TEMP/skills-cli-events.jsonl"
          touch "$AW_SKILLS_EVENT_LOG"
          if [ "$AW_REPORT_PUBLIC_INSTALL" = 'true' ]; then
            unset DISABLE_TELEMETRY DO_NOT_TRACK
          fi
          install_project=$(mktemp -d "$RUNNER_TEMP/skills-cli-project.XXXXXX")
          printf 'AW_SKILLS_INSTALL_ROOT=%s\n' "$install_project" >> "$GITHUB_ENV"
          cd "$install_project"
          node --import "$GITHUB_WORKSPACE/.github/scripts/skills-cli-privacy.mjs" \
            "$RUNNER_TEMP/skills-cli-tool/node_modules/skills/bin/cli.mjs" \
            add suntianhu/agent-workflow-skills --skill '*' --agent codex --copy --yes --json \
            > "$RUNNER_TEMP/skills-cli-result.json"
      - name: Verify installed resources and public event
        shell: bash
        env:
          AW_REPORT_PUBLIC_INSTALL: ${{ inputs.report_public_install }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          temporary = Path(os.environ['RUNNER_TEMP'])
          install_root = Path(os.environ['AW_SKILLS_INSTALL_ROOT']).resolve()
          results = json.loads((temporary/'skills-cli-result.json').read_text())
          expected = {row['name'] for row in json.loads((root/'catalog.json').read_text())['skills']}
          assert len(results) == len(expected) and {row['name'] for row in results} == expected
          checked = 0
          for row in results:
              assert row['status'] == 'installed' and row['scope'] == 'project'
              source = root/'skills'/row['name']
              installed = Path(row['path']).resolve()
              assert installed.is_relative_to(install_root)
              originals = {path.relative_to(source) for path in source.rglob('*') if path.is_file()}
              copies = {path.relative_to(installed) for path in installed.rglob('*') if path.is_file()}
              assert originals == copies
              for name in originals:
                  assert hashlib.sha256((source/name).read_bytes()).digest() == hashlib.sha256((installed/name).read_bytes()).digest()
                  checked += 1
          events = [json.loads(line) for line in (temporary/'skills-cli-events.jsonl').read_text().splitlines() if line]
          assert not any(event['action'] == 'blocked' for event in events)
          reported = os.environ['AW_REPORT_PUBLIC_INSTALL'] == 'true'
          responses = [event for event in events if event['action'] == 'response' and event['endpoint'] == '/tele/t']
          if reported:
              requests = [event for event in events if event['action'] == 'allowed' and event['endpoint'] == '/tele/t']
              assert len(requests) == len(responses) == 1 and 200 <= responses[0]['status'] < 300
          else:
              assert not events
          summary = {'skills':len(results), 'byte_identical_files':checked, 'public_install_reported':reported, 'event_status':responses[0]['status'] if responses else None, 'submitted_field_names':sorted(requests[0]['fields']) if reported else [], 'model_execution':'not_run'}
          (temporary/'skills-cli-summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          print(json.dumps(summary))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Skills CLI compatibility: '+json.dumps(summary)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skills-cli-summary
          path: ${{ runner.temp }}/skills-cli-summary.json
          retention-days: 7
