name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-18
        with:
          persist-credentials: false
      - run: python --version
      - run: python scripts/validate.py
      - run: python scripts/run_examples.py
        env:
          PYTHONUTF8: '1'
      - name: Dry-run release packaging
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("catalog.json", encoding="utf-8"))["version"])')
          python scripts/build_release.py --tag "v$version" --out "$RUNNER_TEMP/release-preview"
